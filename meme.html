<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .meme-container {
            max-width: 800px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            z-index: -1;
        }
    </style>
    <script>
        addEventListener('DOMContentLoaded', () => {
            const memeContainer = document.querySelector('.meme-container');
            memeContainer.addEventListener('click', () => {
                alert('You clicked on the meme!');
            });
        });
    </script>
</head>
<body>
    <div class="meme-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbkFFwHOqHbwDQ_AUZjqHkHjv1g7DFRzePMk6Ub3pxDoDk0b_H1cgMogY&s=10" alt="Meme">
    </div>
</body>
</html>
