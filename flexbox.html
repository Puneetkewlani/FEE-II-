<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:200px;
            width:200px;
            border:2px solid red;
            margin-left:100px;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
        }
        .childbox{
            width:30px;
            height:30px;
            border:2px solid black;
        }
        nav {
            background-color: #585858;
            border: 2px solid #000;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-right: 50px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        nav ul li a:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <p>Code verse</p>
    <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Portfolio</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav><br>
    <div class="box">
        <div class="childbox">1</div>
        <div class="childbox">2</div>
        <div class="childbox">3</div>
        <div class="childbox">4</div>
        <div class="childbox">5</div>
    </div>
    
</body>
</html>
